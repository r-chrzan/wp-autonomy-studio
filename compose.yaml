# Local development database. `docker compose up -d db`
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wpas
      POSTGRES_PASSWORD: wpas
      POSTGRES_DB: wpas
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wpas -d wpas"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
