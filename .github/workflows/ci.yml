name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Build-time value; the build doesn't connect. Jobs that need a database override it.
  DATABASE_URL: postgresql://wpas:wpas@localhost:5432/wpas
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  typecheck:
    name: Typecheck and unused code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run knip

  unit:
    name: Unit tests (100% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails when any of lines/branches/functions/statements drops below 100%.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  integration:
    name: Integration tests (Testcontainers + agent-browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Chrome for Testing plus the Linux libraries it needs.
      - run: npx agent-browser install --with-deps
      # Builds the app, then starts PostgreSQL (Testcontainers) and the built app per run.
      - run: npm run test:integration

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Critical only: high advisories without a fix are reviewed in dependency-review below.
      - run: npm audit --omit=dev --audit-level=critical
      # Gitleaks CLI image (the gitleaks-action needs a license for organization repos).
      - name: Scan for committed secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
      # Needs GitHub Advanced Security, which private repos on the free plan don't have;
      # runs automatically once the repository is public (or the plan includes it).
      - uses: actions/dependency-review-action@v5
        if: github.event_name == 'pull_request' && !github.event.repository.private
        with:
          config-file: ./.github/dependency-review-config.yml
