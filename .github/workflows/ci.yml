name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Build-time value; the build doesn't connect. Jobs that need a database override it.
  DATABASE_URL: postgresql://wpas:wpas@localhost:5432/wpas
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: Format, lint, typecheck, knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage -- --project unit

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  build-e2e:
    name: Build and E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wpas
          POSTGRES_PASSWORD: wpas
          POSTGRES_DB: wpas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wpas -d wpas"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migration:up
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: packages/app
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: packages/app/playwright-report/
          retention-days: 7

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Critical only: high advisories without a fix are reviewed in dependency-review below.
      - run: npm audit --omit=dev --audit-level=critical
      # Gitleaks CLI image (the gitleaks-action needs a license for organization repos).
      - name: Scan for committed secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
      - uses: actions/dependency-review-action@v5
        if: github.event_name == 'pull_request'
        with:
          config-file: ./.github/dependency-review-config.yml
